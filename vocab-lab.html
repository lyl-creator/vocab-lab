show something is funny.","😍 A yellow face with smiling eyes, a closed smile, rosy cheeks, and several hearts floating around it. It is used to express a range of happy feelings, especially being in love.","🍕 A slice of pizza. It can be used when people are eating or want to eat pizza.","🔥 A small flame, mostly yellow but red at the top. It can be used to describe something or someone being hot, or in the context of being exemplary.","🐶 A dog's face with its tongue sticking out. It is used in messages about people's dogs or to accompany photos of cute dogs.","✔️ A thick, filled-in check mark. It shows approval or that something has been green-lit to move on to the next step of a process."]},{id:"u1-episode-2",unit:1,section:"Episode 2",title:'"Very happy" or "ready to fight": How clear is the message?',source:"Unit 1 · Episode 2",paragraphs:["It is estimated that emojis are used, to varying degrees, by 90 percent of the world's online population. But are we all clear on what they mean?",`Emojis can be interpreted differently by different people. A study conducted at the University of Minnesota found that respondents disagreed 25 percent of the time on whether an emoji's meaning was positive, negative, or neutral. The researchers rightly maintain that while words have a dictionary definition, emojis are trickier and are often open to interpretation. Even the popular "face with tears of joy" emoji is often misunderstood as a sad crying face by some users.`,'This ambiguity increases with the fact that emoji designs are not standardized across all devices, or "platforms", being used. Some of these designs are more ambiguous than others. Take the "grinning face with smiling eyes" emoji, pictured below, for example. On Samsung devices, it is perceived by readers as "very happy", because of its broad and open smile. However, the exact same emoji displayed on Apple devices is a clenched-teeth smile, and is often perceived as "ready to fight". As we can see from this example, it is important for designers to be really clear about what they want their emoji to communicate, and make sure that it cannot be too easily misinterpreted.','There is also a cultural dimension to how we interpret and use emojis. For example, in many countries, the "sign of the horns" emoji is seen as a lucky sign, but in Brazil, Greece and Spain, if it is directed at a specific person it means that their partner has cheated on them! The "thumbs-up" emoji is seen as a positive symbol in most of the world, but in Iran, Iraq and Nigeria it is interpreted negatively. In most countries the "fire" emoji has the literal meaning of heat, but in Trinidad and Tobago and the U.K. it is often used to mean attraction.',"Sign of the horns: Lucky or cheating? Thumbs-up: Positive or negative? Fire: Heat or hot?","So next time we send a message, remember that our reader may interpret our emojis differently from what we intended. As emojis are a relatively new form of communication, the way they are used and understood is still evolving. Hopefully, as time passes, the design of emojis will become more standardized and their interpretations will be consistent, so that fewer or no communication challenges arise."]},{id:"u1-text-a",unit:1,section:"Text A",title:"Is the Internet destroying our social norms?",source:"Unit 1 · Text A",paragraphs:[`1 For any athlete, failing to win a gold medal at the Olympics can be a great disappointment. However, for British Olympic diver Tom Daley, failure to win gold at the 2012 London Olympics was even worse, thanks to malicious online abuse he suffered as a result. His father had recently died of cancer, and Tom was bullied online by a teenager, who said that he had "let his father down". Tom called this person out, but the attacks persisted, both on Tom and those who defended him online. The bully was later arrested and given a warning for harassment. Of course, there are many positive benefits that online communication can bring us, such as being able to keep in touch with family and friends all around the world, but Tom Daley's story is just one of the many examples that remind us of this technology's dark side.`,'2 Anyone will tell you that communication online is often a much less civil affair than traditional forms of communication, especially face-to-face interactions. When interacting with people we actually know in real life, most people communicate according to socially accepted rules of politeness. However, in more public forums, such as on social media, these rules just seem to disappear. There are many who post offensive comments just for the purpose of starting arguments. These people are known as "trolls", and they seem to be increasing in number as the norms of acceptable behavior online become increasingly blurry.',"3 So, why is this happening?",`4 When communicating online, even when we use our real identities, we feel detached from the people we are interacting with. This is because we often don't know them personally, and feel we are unlikely ever to meet them face to face. Sometimes this distance is positive, because it makes it easier for people to be more "open" online. However, not looking into people's faces or hearing their voices also makes it easier for us to forget that they are real people, with real feelings that can be hurt.`,`5 It also seems that we get "positive reinforcement" from the attention that bad behavior can give us online, and this can inflate our sense of self and lead to online bullying. In interviews after his arrest, Tom Daley's troll said that he was proud of how his cruel messages had become so notorious on the Internet and in the media. It seems as if the whole thing was just a game for him. Of course, this kind of negative behavior is only carried out by a small proportion of "netizens", but it has an impact on the whole tone of online communication, and can easily spread if not kept in check.`,"6 This problem is not going away, so action needs to be taken to control it. Obviously, the Internet service providers have a responsibility to police the most extreme types of online abuse, as do the authorities. However, a better solution would be to try and deal with the problem in a preventative way, through education. Now that the Internet is such a big part of our lives, parents and schools need to teach children about politeness and acceptable norms of behavior. So far the education system has been slow to act, but thanks to several high-profile cases of cyberbullying, this is now beginning to change. Schools are now increasingly giving children guidance on online behavior and teaching them how to stay safe.","7 Our society is currently going through a period of transition in relation to online communication, and we are only just coming to terms with some of the challenges it presents. Hopefully, we can now start work on finding the solutions, since many of the problems have been identified. Then, we can ensure that everyone has the chance to enjoy the amazing benefits that the Internet can bring."]},{id:"u1-text-b",unit:1,section:"Text B",title:"Switch off? How difficult!",source:"Unit 1 · Text B",paragraphs:[`Nicky: Help! I think I'm addicted to social media and need to break out of it. I can't help checking my social media accounts and spending hours chatting with friends online. It feels like my "real" life has been stolen from me. If you've got experience of controlling a similar online addiction, please share any tips or advice here. Thanks in advance.`,"Mr. Helpful: Don't you see the irony of asking for help this online? Log off already!","NetWizard: That wasn't very helpful, was it?","Max (Reformed Internet Addict): Hi Nicky. Ignore the trolls! I had a similar problem and I've managed to cut my screen time down by more than half! Can I ask you some questions first to find out more about your online habits?","• How much time do you spend online each day?","• Which social media platforms do you use most?","• When do you spend most time online?","• How did you spend your free time before?","Nicky: Sure, I spend about 4—5 hours a day online on average, mostly on Facebook, Instagram and Twitter. I check all my accounts first thing in the morning and even wake up sometimes in the night and check my phone. I am checking them all throughout the day at college, and in lectures, and spend lots of time online in the evening watching videos. It just sucks me in! I used to read quite a bit and do yoga most evenings. Hoping you can help me achieve what you've done!",`Max (Reformed Internet Addict): So … the first thing I did was to set myself a limit on my screen time, and then I used an app to help monitor and control it. Setting realistic targets helped reduce my screen time gradually week by week. The app also helped me monitor how I was spending my time online, and made me realize that I was actually looking at the same things over and over again on social media. So I decided to limit myself and only check my accounts three times a day. Once in the morning, once around lunchtime and then one more time in the evening. Another thing that helped me was turning off the notification alerts so that my phone wasn't "pinging" all the time. This REALLY helped me break the habit of constant checking!`,"Without interruptions from your phone you'll probably get back into reading and yoga. That will help calm your mind for sure. Good Luck!","Nicky: Thanks for the tips, Max! I'll give your suggestions a go!","Alison: Great ideas! Another thing I've done is change a setting on my phone so that it isn't constantly connected to the Internet. This limits my screen time, especially when I'm out, and it also saves money!","Wilderness Addict: Going offline is the answer! Not forever, of course, but taking real breaks from it makes you realize how you can live without the Internet. Go away somewhere offline. A weekend away camping is the perfect way to reconnect with nature and break your Internet addiction at the same time. Then it will be easier to do the things Max suggests.","Nicky: Thanks, Wilderness Addict. I think that might be the answer. I used to really love walking and camping when I was a kid. I'd love to pack a good book and my yoga mat and leave my phone at home!","Paul: Delete some of the social network apps from your phone. I did this and now only use 2 social media networks, down from 5. It really helped me limit the time I spend checking updates.","Christina: Don't forget to use some of the time you save to strengthen your relationships with your friends and family. Arrange to see them more often — keep your phone in your bag and enjoy quality time with the people you love!","Nicky: Thanks everyone for the great advice. I'm logging off now!"]},{id:"u2-episode-1",unit:2,section:"Episode 1",title:"Three entrepreneurs",source:"Unit 2 · Episode 1",paragraphs:['Gou Yingda · Yenong Youpin — "Internet Plus" and problem solving',"Growing up with the Internet, Gou Yingda understood the value that it could bring to people's lives. At a young age, he also understood the commercial value that it could bring to traditional industries. He set his sights on agriculture, and could see the huge business potential if the industry could embrace information technology. He identified that the key problem with the industry was the growing concern over food safety. So he developed a clear picture of what he could do to increase the transparency of agricultural operations and build people's trust in agricultural products. He started an Internet company named Yenong Youpin. The company sets up cameras on its farmland and provides real-time updates via live streams, so urban consumers can check on the plants with mobile phones. In this way, the company links farmers with consumers while guaranteeing green and organic produce.","Richard Ludlow · Academic Earth — Entrepreneurial ideas inspired by one's own experiences","While studying at Yale University, Richard supplemented his studies with online video-based resources from other famous universities, such as MIT. He had the idea of creating an online platform to provide access to high-quality learning materials from a variety of disciplines free of charge to students around the world. At the age of 22, he co-founded Academic Earth with Chris Bruner and Liam Pisano. Their website was launched the following year. The site took off thanks to word-of-mouth praise by bloggers and sharing on social media. Later on, Academic Earth was acquired by an education technology company, and continued to provide free online college courses as well as original videos.","Fraser Doherty · SuperJam — From Granny's kitchen to the supermarket shelves and beyond","Who would have thought that Grandma's jam recipe could become the basis for a successful business? Fraser Doherty did! When Fraser Doherty was 14, he learned to make many different jams from his grandmother. At first, he made jams in his parents' kitchen and sold the jam he made around his neighborhood and at the farmers' market. Later, he wanted to turn this into a career. He started to do some research and found that jam sales had been falling because people considered jam to be unhealthy, containing a lot of sugar and additives. He decided, therefore, to make healthier jams. Based on his grandmother's recipe, he successfully devised a way of producing jam using just 100 percent fruit and started his own small company, SuperJam. Two years later, his product was picked up by the supermarket chain Waitrose, and Fraser became the youngest ever supplier to a U.K. supermarket."]},{id:"u2-episode-2",unit:2,section:"Episode 2",title:"Market research methods",source:"Unit 2 · Episode 2",paragraphs:["Surveys are designed to help researchers gain an understanding of people's behaviors or opinions. Sampling, or selecting a specific group of people to take a survey, allows researchers to infer information about a population based on the survey results, without having to investigate every individual. To create a representative sample, researchers need to make sure that the sample group reflects the characteristics of the target social group in terms of age, gender, education, etc. There are two main types of survey research: questionnaires and interviews.","Questionnaires which participants complete themselves can be easily administered to large groups. However, the number of people who respond can be low and it's not easy to control who actually complete them. Interviews are conducted face to face, or by telephone, with interviewers directly asking the questions and recording the answers. They are more personal, and if necessary, the interviewer can ask follow-up questions for clarification. Interview studies are often used to collect information about respondents' opinions, but they can be time-consuming and costly.",'Broadly speaking, the two main types of questions included in surveys are "closed" and "open" questions. Closed questions have fixed responses and lend themselves well to statistical analysis. For example: How often do you purchase X? Once a week / Once a month / Once a year / Rarely or never. How much do you enjoy using X? 0 (not at all)—4 (very much). Would you purchase X again? Yes / No / Undecided.',"On the other hand, open questions allow respondents to answer more freely and in greater detail, but are more time-consuming and can be difficult to analyze. For example: Why did you choose to purchase X? What do you think could be improved about X?","Well-constructed surveys can provide researchers with useful data to help them understand people's behaviors and opinions.","A focus group is a group of people who are chosen to represent the target population. They are brought together and interviewed together by a professional moderator who guides the discussion. The use of focus groups is a research method to gain an understanding of people's feelings or perceptions on a certain topic. The moderator will often follow a planned sequence to question the participants, and will encourage them to interact with and influence each other.","Focus groups are often used in commercial market research. It is considered a good way of gauging the opinions and perceptions of specific groups of people toward a product or brand. The quality of focus group research is heavily dependent on the quality of discussion, so it is important that focus group members are selected carefully, and that the moderator creates an environment in which they feel comfortable to express their views honestly and openly."]},{id:"u2-text-a",unit:2,section:"Text A",title:"The rise of the gig economy",source:"Unit 2 · Text A",paragraphs:['1 The term "gig economy" is one that we hear increasingly often these days. It refers to a way of working that is based on people working in flexible, task-based employment. In the gig economy, people are paid for specific jobs that they do without the benefits and security of full-time employment. The number of people involved in the gig economy is rising rapidly, with an increase in the U.S. from around 10 percent of the workforce to almost 16 percent in the last decade. More than 10 percent of workers in China are self-employed. "The desire for autonomy is strongest in China, especially among young people," reads a report by PwC, one of the leading accounting firms. This indicates "a generational shift toward greater freedom, entrepreneurship, and specialist skills in this rapidly evolving economy".','2 The rise of this global phenomenon has largely been driven by technological advances that allow people to manage their work through computers and smartphones. Online platforms connect consumers and suppliers easily and disrupt traditional ways of doing business. Advancements in technology also mean that people can be employed remotely, even in other countries, and there is a new breed of people opting to travel and work online in various locations around the world, who are known as "digital nomads".',"3 However, even though technology is often considered the primary driving force behind the gig economy, it is by no means the only one.",`4 To begin with, attitudes to work are changing, as younger people embrace the independence and flexibility that the gig economy offers, allowing them to break free of traditional work routines. Shaun, a delivery driver, says, "The flexibility suits me well. I work when I want to and enjoy the work-life balance. I'm my own boss."`,`5 Furthermore, employers often favor a more flexible approach to employing workers, as and when they need them. This allows them to cut costs and reduce the bureaucracy necessary when offering permanent employment. Becky, a manager at the delivery firm that Shaun works for, states, "We have a large pool of people working for us. We give them work when we have it, but we only pay them for the work they do. It's a win-win situation."`,"6 Employers are also aware that the world of work is changing rapidly, and with it, so are many of the skills that they require. It can be difficult, and expensive, for companies to attract employees with the wide skill set that they require. The flexibility offered by the gig economy can make finding the right people for each job much easier and much cheaper.","7 Despite offering certain benefits to employers and employees, many observers feel that the gig economy leaves employees worse off. The flexibility may be good, but it is often paid for with a lack of job security and benefits. When workers have plenty of work, things are generally fine, but what about when a worker falls ill and cannot work? Do they still receive sick pay? And how about holiday pay? Moreover, in conventional jobs there are often paths for career progression within a company, moving up the ladder. However, such opportunities are not so easy when one works freelance. These may not be the first things that young people in the workplace consider, but they may have serious implications in the future.","8 Even with the potential downside, it seems that the gig economy is here to stay. Many of the driving forces behind the trend, such as changes in technology and people's attitudes to work, are showing no sign of easing. China Daily reported that the gig economy in China is predicted to grow by 30 percent per year over the next few years, and that it is likely to become even more important in areas such as agriculture, health care and education. There are likely to be winners and losers on all sides, but it is important for society to recognize these issues and ensure that people working in the gig economy are treated fairly."]},{id:"u2-text-b",unit:2,section:"Text B",title:"Will artificial intelligence create mass unemployment?",source:"Unit 2 · Text B",paragraphs:["1 Aura and Ausca are workers at the M Social hotel in Singapore. Aura's job is mostly delivering items like bottled water and towels to rooms, while Ausca is responsible for cooking eggs for the restaurant in the morning. Aura and Ausca are available for work 24 hours a day, 7 days a week, and work for a fraction of the cost of most other employees. This is because they are robots. As time goes on, it seems inevitable that more and more robots like Aura and Ausca will populate such service roles. And while this may be great for the bank accounts of the companies that use them, many are concerned about what this means for the future of the human workers who cannot compete with their robot equivalents.","2 Artificial intelligence (AI) and robotics are regular news items these days, and the main focus seems to be the fear that these technologies will ultimately replace humans. A study by the McKinsey Global Institute has estimated that AI and automation could threaten 15%–30% of human jobs by 2030, meaning that anywhere from 400 million to 800 million jobs could be lost. This could eliminate whole areas of employment, leaving people's existing workplace skills and knowledge redundant. Low-skilled and low-paid workers would be influenced most significantly, and their jobs are likely to be the first to go. As the study suggests, the jobs AI will first impact are those characterized by predictable or repetitive tasks, whether physical or mental, in such areas as manufacturing, office administration, and food production.","3 There is concern by many that the increased unemployment may cause social problems and political unrest if measures are not taken. However, there are also many who believe that overall, AI will make positive impacts on society. Some are seeing it as another revolution in the economy along the lines of the industrial revolution that took place in Europe and America in the 18th and 19th centuries. During that time, the steam engine revolutionized society and led to great advances in transportation, the beginning of mass production of goods in factories, and rapid urbanization. In the past, humans managed to adapt to such major changes in society, and it is argued that AI can be viewed as the next big development.","4 While innovations in AI will impact certain types of work, it is hoped that it will also give rise to whole new areas of business. For example, there are likely to be major developments in health care thanks to AI, and it could also allow people to transition from ordinary and routine jobs to more meaningful careers. It is also believed that AI has the potential to bring global economic prosperity at a time when we face the challenges of falling birth rates, an aging population and slowing productivity in many countries.","5 The reality of the situation is that economies will certainly be transformed by AI, and employment opportunities will change dramatically. There will be less demand for manual and basic thinking skills in the workplace and an increased requirement for social and technological skills. Inevitably, some people will need to change their jobs and there will be a need for many people currently in the workforce to retrain. Those newly entering the workforce will also need flexible skill sets to match the changes in our economies. In the future, employers will look for higher-order thinking skills as well as sophisticated social and technological skills.",'6 The McKinsey Global Institute concludes, "There is work for everyone today and there will be work for everyone tomorrow, even in a future with automation. Yet that work will be different, requiring new skills, and a far greater adaptability of the workforce than we have seen. Training and retraining both mid-career workers and new generations for the coming challenges will be an imperative."']}],Dz=[{i:0,en:"abandon",ipa:"əˈbændən",zh:"v. 遗弃；离开；放弃；终止；陷入n. 放任，狂热",high:!1},{i:1,en:"ability",ipa:"əˈbɪləti",zh:"n. 能力，能耐；才能",high:!1},{i:2,en:"able",ipa:"ˈeɪbl",zh:"adj. 能；[经管] 有能力的；能干的n. (Able)人名；(伊朗)阿布勒； (英)埃布尔",high:!1},{i:3,en:"abnormal",ipa:"æbˈnɔːrml",zh:"adj. 反常的，不规则的；变态的",high:!1},{i:4,en:"aboard",ipa:"əˈbɔːrd",zh:"adv. 在（飞机、火车、船）上；骑在（马）上；（喻）新入伙；（棒 球）在垒上prep.  在 （船或飞机）上",high:!1},{i:5,en:"about",ipa:"əˈbaʊt",zh:"adv.附近,大约,转向,左右,周围;prep.在附近,关于,在...周围,忙于",high:!1},{i:6,en:"above",ipa:"əˈbʌv",zh:"adj.上面的,上述的,上文的;adv.在上面;prep.在...上方,过于,超出",high:!1},{i:7,en:"abroad",ipa:"əˈbrɔːd",zh:"adv. 在国外；到海外adj. 往国外的n. 海外；异国",high:!1},{i:8,en:"absence",ipa:"ˈæbsəns",zh:"n. 没有；缺乏；缺席；不注意",high:!1},{i:9,en:"absent",ipa:"ˈæbsənt",zh:"adj. 缺席的；缺少的；心不在焉的；茫然的vt. 使缺席",high:!1},{i:10,en:"absolute",ipa:"ˈæbsəluːt",zh:"adj. 绝对的；完全的；专制的n. 绝对；绝对事物",high:!0},{i:11,en:"absolutely",ipa:"ˈæbsəluːtli",zh:"adv. 绝对地；完全地",high:!1},{i:12,en:"absorb",ipa:"əbˈzɔːb",zh:"vt. 吸收；吸引；承受；理解；使…全神贯注",high:!1},{i:13,en:"abstract",ipa:"ˈæbstrækt",zh:"adj. 纯理论的；抽象的；抽象派的n. 摘要；抽象；抽象的概念；抽 象派艺术作品v. 摘要；提取；抽象化；退出；转移；使心不在焉",high:!1},{i:14,en:"abundant",ipa:"əˈbʌndənt",zh:"adj. 丰富的；充裕的；盛产的",high:!0},{i:15,en:"abuse",ipa:"əˈbjuːs",zh:"n. 滥用；虐待；辱骂；弊端；恶习，陋习vt. 滥用；虐待；辱骂n. (Abuse)人名；(英)阿比斯",high:!0},{i:16,en:"academic",ipa:"ˌækəˈdemɪk",zh:"adj. 学术的；理论的；学院的n. 大学生 intensity is too dull while high intensity is too unpleasant."],bank:[{letter:"A",word:"constitutes"},{letter:"B",word:"contradictory"},{letter:"C",word:"decision"},{letter:"D",word:"detailed"},{letter:"E",word:"difference"},{letter:"F",word:"dipping"},{letter:"G",word:"distinction"},{letter:"H",word:"falling"},{letter:"I",word:"involves"},{letter:"J",word:"moderate"},{letter:"K",word:"notified"},{letter:"L",word:"partly"},{letter:"M",word:"required"},{letter:"N",word:"traditionally"},{letter:"O",word:"vigorous"}],answers:["D","M","L","F","G","I","O","B","E","J"]},{id:"2024-06-2",source:"2024年06月 · 第2套",paragraphs:["A team of researchers led by Priyanka Joshi examined the degree to which men and women relied on “communicative abstraction” to verbally convey their ideas and emotions. Communicative abstraction, according to the researchers, reflects the tendency of people to use “abstract speech that focuses on the broader picture and 26        purpose of action rather than concrete speech focusing on details and the means of         27     action.” Interestingly, they found that men were far more likely to speak in the abstract than were women.","To arrive at this    28    , the researchers examined the linguistic (语言的) patterns of men and women in over 600,000 blog posts written on websites. To do this, the researchers computed abstractness ratings for         29     40,000 commonly used words in the English language. Words considered to be concrete could be easily visualized, such as “table” or “chair”. Words that were more          30      to visualize, for example, “justice” or “morality” were considered to be more abstract. They found that men used       31 more abstract language in their blog posts.","What is the       32    of this effect? The researchers suggest that power differences between the genders— that is, men having more power in society—might be a key determinant (决定因素). For instance, in a follow-up study conducted with a sample of 300 students, the researchers     33     power dynamics in an interpersonal setting to see if this would influence communicative abstraction. They found that participants in a high-power interviewer role were more likely to give abstract descriptions of behaviors than were participants in a low-power interviewee role. This suggests that communicating more abstractly does not reflect a         34 tendency of men or women but rather        35 within specific contexts."],bank:[{letter:"A",word:"approximately"},{letter:"B",word:"attaining"},{letter:"C",word:"conclusion"},{letter:"D",word:"difficult"},{letter:"E",word:"emerges"},{letter:"F",word:"fixed"},{letter:"G",word:"ignored"},{letter:"H",word:"legally"},{letter:"I",word:"manipulated"},{letter:"J",word:"recommended"},{letter:"K",word:"refraining"},{letter:"L",word:"signals"},{letter:"M",word:"significantly"},{letter:"N",word:"source"},{letter:"O",word:"ultimate"}],answers:["O","B","C","A","D","M","N","I","F","E"]},{id:"2024-06-3",source:"2024年06月 · 第3套",paragraphs:["Over the coming decades, millions of jobs will be threatened by robotics and artificial intelligence. Despite intensive academic        26 on these developments, there has been little study on how workers         27     to being replaced through technology.","To find out, business researchers at TUM and Erasmus University Rotterdam conducted 11 studies and surveys with over 2,000 persons from several countries.","The findings show: In principle, most people view it more            28   when workers are replaced by other people than by robots or intelligent software. This preference              29 , however, when it refers to people’s own jobs. When that is the case, the majority of workers find it less upsetting to see their own jobs go to robots than to other employees. In the long term, however, the same people see machines as more threatening to their future role in the workforce. These effects can also be observed among people who have recently become unemployed.","The researchers were able to identify the causes behind these       30 paradoxical results, too: People tend to           31       themselves less with machines than with other people. Consequently, being replaced by a robot or software 32 less of a threat to their feeling of self-worth. This reduced self-threat could even be observed when participants assumed that they were being replaced by other employees who relied on technological abilities such as artificial intelligence in their work.","“Even when unemployment results from the              33 of new technologies, people still judge it in a social context,” says Christoph Fuchs, one of the authors of the study. “It is important to understand these         34 effects when trying to manage the massive changes in the working world to minimize           35 in society.”"],bank:[{letter:"A",word:"compare"},{letter:"B",word:"contradicts"},{letter:"C",word:"conventional"},{letter:"D",word:"debate"},{letter:"E",word:"disruptions"},{letter:"F",word:"drastically"},{letter:"G",word:"favorably"},{letter:"H",word:"guarantee"},{letter:"I",word:"introduction"},{letter:"J",word:"modifications"},{letter:"K",word:"poses"},{letter:"L",word:"psychological"},{letter:"M",word:"react"},{letter:"N",word:"reverses"},{letter:"O",word:"seemingly"}],answers:["D","M","G","N","O","A","K","I","L","E"]},{id:"2025-06-1",source:"2025年06月 · 第1套",paragraphs:["Psychologists have long been interested in how we construct our identities and the sorts of strategies that we use to present ourselves in society. New findings suggest that the kinds of 26 and strategic self-presentation behaviour we see in adults appear at a much younger age than 27 known.","Research shows that a child's awareness of social standing comes from adults. Like grown-ups, kids want to be 28 by those they admire. Interactive experiences may provide opportunities for children to learn about what 29 a desirable reputation and the kinds of strategies that are effective for 30 a good reputation in their social environment.","Five-year-olds aren't just aware of their reputations, they also behave strategically to alter their outward image. They will 31 their behaviour in order to appear moral or socially good in the eyes of key observers. While we know that adults use a large variety of attributes to manage and create impressions, we don't yet know whether children 32 and use the fact that different attributes are valuable at different times to different 33. It's important for us to further consider where in this process children succeed in controlling their reputation and where they 34.","A question to think about is, “What happens even earlier than age five?” Children don't just show up to the first day of kindergarten and have the idea of reputation pop 35 into existence. The logical question to ask is, “What happens even earlier?”"],bank:[{letter:"A",word:"accepted"},{letter:"B",word:"audiences"},{letter:"C",word:"building"},{letter:"D",word:"complex"},{letter:"E",word:"constitutes"},{letter:"F",word:"deputies"},{letter:"G",word:"previously"},{letter:"H",word:"revolving"},{letter:"I",word:"samples"},{letter:"J",word:"selected"},{letter:"K",word:"solemn"},{letter:"L",word:"struggle"},{letter:"M",word:"suddenly"},{letter:"N",word:"understand"},{letter:"O",word:"vary"}],answers:["D","G","A","E","C","O","N","B","L","M"]},{id:"2025-06-2",source:"2025年06月 · 第2套",paragraphs:["Sir Alfred Hitchcock was an English movie director and producer. Famously 26 to as “The Master of Suspense”, Hitchcock is one of the most influential filmmakers in the history of 27. He was an extraordinary director who entertained his audience with 28 and gripping suspense movies.","His fascination with crime began at an early age when he was 29 by his father who made him spend a few minutes inside a prison for his misconduct. Hence, his movies are 30 of the guilt and innocence of the wrongdoer and the victim. He had a gift for creating stories that consisted of deceit, robbery, murder, corruption, and other criminal 31 with incredible plot twists in the storyline. The principal characters in his movies were often ordinary people 32 in unwanted and unavoidable situations.","He was 33 productive and his amazing body of work is considered fascinating by the critics. Most of his movies have 34 the test of time and are considered to be masterpieces. He is also remembered by other filmmakers, for he continues to inspire them to be passionate about their work. He is also 35 by people around the world for his entertaining and exciting stories."],bank:[{letter:"A",word:"caught"},{letter:"B",word:"cinema"},{letter:"C",word:"engaging"},{letter:"D",word:"graphically"},{letter:"E",word:"highly"},{letter:"F",word:"incentive"},{letter:"G",word:"instincts"},{letter:"H",word:"offences"},{letter:"I",word:"punished"},{letter:"J",word:"referred"},{letter:"K",word:"stood"},{letter:"L",word:"symbolic"},{letter:"M",word:"tuned"},{letter:"N",word:"visually"},{letter:"O",word:"worshipped"}],answers:["J","B","C","I","L","H","A","E","K","O"]},{id:"2025-06-3",source:"2025年06月 · 第3套",paragraphs:["The human brain has the ability to constantly form new networks and connections between brain cells. This means the brain has an almost magical ability to change. This characteristic is 26 apparent in a new study, focusing on people who underwent a hemispherectomy, a surgical procedure in which half of the brain is removed to treat illness.","The findings showed that, despite missing half of this critical 27, participants could function well. This was because the 28 half of their brain strengthened. In fact, researchers found that connections—and thus communication—between parts of different brain networks are actually stronger in people who had hemispherectomies than in people with intact brains. This 29 that the brain is able to compensate for loss of certain brain structure.","There are many other cases in the medical 30 that document the brain's amazing ability to 31. For example, a young boy had a significant portion of his brain removed for medical reasons, which included the part of the brain 32 for sight. But a few years after his surgery, scientists found that he could 33 see. They determined that this was because other parts of his brain took over the missing parts' 34 tasks. Another study involved people who could smell, despite missing the region in the brain that processes information about smells. Though they are not sure how these individuals 35 the ability to smell, scientists believe it is possible that another part of the brain took on that task."],bank:[{letter:"A",word:"adapt"},{letter:"B",word:"hardly"},{letter:"C",word:"indicates"},{letter:"D",word:"insist"},{letter:"E",word:"literature"},{letter:"F",word:"organ"},{letter:"G",word:"particularly"},{letter:"H",word:"remaining"},{letter:"I",word:"responsible"},{letter:"J",word:"retained"},{letter:"K",word:"still"},{letter:"L",word:"strategy"},{letter:"M",word:"transformed"},{letter:"N",word:"underlines"},{letter:"O",word:"visual"}],answers:["G","F","H","C","E","A","I","K","O","J"]},{id:"2025-12-1",source:"2025年12月 · 第1套",paragraphs:["People tend to want as many choices as possible. They believe this will maximize their 26 of making the best decision. But research shows that, when it comes to actually making a 27 from all of these choices, people can become 28 and avoid making a decision altogether. Even worse, when people finally do decide, they are generally less satisfied with their decision and feel more regretful over whatever choice they made.","Why does this happen? Research shows that when people choose from many options, they 29 more in the decision, but feel less confident in their ability to decide well. In other words, when we are 30 with more choices, making the “right” or “correct” decision begins to feel more 31 and, at the same time, more difficult to do. This may contribute to the deep fear that we will make the wrong decision.","How can we solve this problem? I believe this fear could be tempered by putting decisions into perspective. It might help to remember that many of the choices you make, such as what to have for lunch, will not 32 much in the future and that, even more important choices, like accepting a new job, can 33 be changed. It could also help to 34 these situations with clear guidelines and ideas of what you want from the 35 of options, which can narrow the possible choices, and also make you more confident about your ability to make the right decision."],bank:[{letter:"A",word:"approximately"},{letter:"B",word:"case"},{letter:"C",word:"chance"},{letter:"D",word:"confused"},{letter:"E",word:"crucial"},{letter:"F",word:"deposited"},{letter:"G",word:"enter"},{letter:"H",word:"invest"},{letter:"I",word:"matter"},{letter:"J",word:"presented"},{letter:"K",word:"range"},{letter:"L",word:"regular"},{letter:"M",word:"seize"},{letter:"N",word:"selection"},{letter:"O",word:"ultimately"}],answers:["C","N","D","H","J","E","I","O","G","K"]},{id:"2025-12-2",source:"2025年12月 · 第2套",paragraphs:["Some music inspires you to move your feet, some inspires you to get out there and change the world. In any case, it's 26 to say that music moves people in special ways.","If you're especially into a piece of music, your brain does something called Autonomous Sensory Meridian Response (ASMR), which 27 to you like a sting in your brain.","It turns out that ASMR is pretty special. According to a 28 published study in the Journal of Prevention of Alzheimer's Disease, the part of your brain responsible for ASMR doesn't get lost to Alzheimer's. Alzheimer's 29 to put people into layers of confusion, and the study confirms that music can sometimes 30 lift people out of the Alzheimer's haze and bring them back to (at least a likeness of) normality...if only for a short while. ASMR is powerful stuff!","This phenomenon has been 31 several times but rarely studied properly. One of the most famous examples of this is the story of 92-year-old Henry Dryer, who comes out of dementia (痴呆) while listening to songs from his youth.","Jeff Anderson, associate professor in Radiology at the University of Utah and 32 author on the study, says “In our society, the diagnoses of dementia are 33 resources to the maximum. No one says playing music will be a cure for Alzheimer's disease, but it might make the symptoms more 34, decrease the cost of care and improve a patient's 35 of life.”"],bank:[{letter:"A",word:"actually"},{letter:"B",word:"consequently"},{letter:"C",word:"contributing"},{letter:"D",word:"fair"},{letter:"E",word:"feels"},{letter:"F",word:"manageable"},{letter:"G",word:"mends"},{letter:"H",word:"observed"},{letter:"I",word:"phase"},{letter:"J",word:"plotting"},{letter:"K",word:"quality"},{letter:"L",word:"recently"},{letter:"M",word:"taxing"},{letter:"N",word:"tends"},{letter:"O",word:"yielded"}],answers:["D","E","L","N","A","H","C","M","F","K"]},{id:"2025-12-3",source:"2025年12月 · 第3套",paragraphs:["Earth Day is an annual celebration that honors the achievements of the environmental movement and raises awareness of the need to protect Earth's natural resources for future generations. Earth Day is celebrated on April 22 in the United States and on either April 22 or the day the spring equinox (春分) occurs throughout the 26 of the world.","Environmental activism during the 1960s 27 Wisconsin Senator Gaylord Nelson to create a 28 celebration uniting the environmental movement. With the help of Denis Hayes, a graduate student at Harvard University, Nelson organized the first Earth Day on April 22, 1970, educating participants in the 29 of environmental protection. Attended by 20 million people across the United States, the event 30 support for legislation such as the Clean Air Act and the Endangered Species Act.","In 1990, Hayes organized a global Earth Day, with more than 200 million participants in 140 countries. Earth Day now brings 31 citizens and activists from around the world to raise awareness and take action regarding such environmental 32 as global warming and renewable energy.","Today, the Earth Day Network, which rallies more than 20,000 33 and organizations in 190 countries, supports the Earth Day mission year-round. This mission is founded on the proposition that all people, regardless of race, gender, income, or 34, have a moral right to a healthy, sustainable environment. The Earth Day Network 35 this mission through education, public policy, and activism campaigns."],bank:[{letter:"A",word:"concerns"},{letter:"B",word:"expansion"},{letter:"C",word:"forth"},{letter:"D",word:"geography"},{letter:"E",word:"importance"},{letter:"F",word:"imposed"},{letter:"G",word:"inspired"},{letter:"H",word:"national"},{letter:"I",word:"partners"},{letter:"J",word:"potential"},{letter:"K",word:"pursues"},{letter:"L",word:"rescues"},{letter:"M",word:"rest"},{letter:"N",word:"strengthened"},{letter:"O",word:"together"}],answers:["M","G","H","E","N","O","A","I","D","K"]},{id:"2026-06-1",source:"2026年06月 · 第1套",paragraphs:["One of the biggest controversies over the Industrial Revolution is how it affected the working class. The oldest debates were over whether the standards of living rose or fell. Those that believed they fell claimed that the capitalists 26 every ounce of surplus they could from the working class. Those that believed the standards of living rose claimed that the environment was consumer-friendly, with more and more goods 27 to the working class every year.","Today's historians agree that overall, the standards of living 28 . They do not agree, however, on when this improvement 29 .",'In an effort to solve this controversy, historians have attempted to define 30 what "standard of living" means. They all seem to agree that it should mean happiness, but happiness is impossible to measure. Instead, historians 31 use "real income" as the measure for the standards of living. Real income is money 32 and then adjusted according to the cost of living. However, it does not take into account unemployment, pollution, health, life expectancy, or free time.',"After 33 debate and analysis of the average income, historians have agreed to disagree on whether there was rapid or slow economic growth during the Industrial Revolution. Instead, they have decided to 34 how the Industrial Revolution was affected by other events. They have determined that the Industrial Revolution had an overall positive 35 , but it quite possibly was neutralized by negative events such as wars, high taxes, and rapid population growth."],bank:[{letter:"A",word:"available"},{letter:"B",word:"deteriorating"},{letter:"C",word:"earned"},{letter:"D",word:"effect"},{letter:"E",word:"enhance"},{letter:"F",word:"exactly"},{letter:"G",word:"exhausting"},{letter:"H",word:"experience"},{letter:"I",word:"increased"},{letter:"J",word:"interpret"},{letter:"K",word:"occurred"},{letter:"L",word:"peculiar"},{letter:"M",word:"probably"},{letter:"N",word:"squeezed"},{letter:"O",word:"typically"}],answers:["N","A","I","K","F","O","C","G","J","D"]},{id:"2026-06-2",source:"2026年06月 · 第2套",paragraphs:["It may sound surprising, but people who are supersensitive to coffee’s bitter taste actually drink more of it, a new study finds.","This sensitivity isn’t 26 a matter of taste, either, but rather is influenced by a person’s genetic makeup, the researchers said in the study.","“You’d expect that people who are particularly sensitive to the bitter taste of caffeine would drink less coffee,” said study senior researcher Marilyn Cornelis. “The 27 results of our study suggest coffee consumers acquire a taste for or an ability to detect the bitterness of caffeine due to the learned positive 28 brought out by caffeine.”","Put another way, people who have a 29 ability to taste the bitterness of coffee learn to associate “good things with it,” Cornelis said. This finding is surprising, given that bitterness often serves as a warning mechanism to 30 people to spit out harmful substances, scientists said.","Researchers conducted the study to understand how genetics influences people’s 31 of tea, coffee and alcohol which tend to taste bitter, said lead study researcher Jue Sheng Ong.","“While all bitter flavors may seem the same, we 32 the bitterness of Brussels sprouts (抱子甘蓝), quinine (奎宁) and caffeine 33,” Ong told Live Science. “The degree to which we find these flavors bitter is, in part, determined by your genes.”","People with the genes to taste the bitterness of green vegetables are more likely to prefer tea to coffee. In 34 , people who were more sensitive to quinine’s bitter flavor and those found in green vegetables tended to 35 coffee."],bank:[{letter:"A",word:"addition"},{letter:"B",word:"approximately"},{letter:"C",word:"avoid"},{letter:"D",word:"consumption"},{letter:"E",word:"converted"},{letter:"F",word:"convince"},{letter:"G",word:"heightened"},{letter:"H",word:"omission"},{letter:"I",word:"opposite"},{letter:"J",word:"perceive"},{letter:"K",word:"prospect"},{letter:"L",word:"reinforcement"},{letter:"M",word:"separately"},{letter:"N",word:"simply"},{letter:"O",word:"targeted"}],answers:["N","I","L","G","F","D","J","M","A","C"]},{id:"2026-06-3",source:"2026年06月 · 第3套",paragraphs:["Junk-food lovers who try to cut back on fries or chocolate may experience symptoms similar to drug withdrawal, a new study suggests.","Researchers found that people attempting to cut down on eating highly processed foods experience some of the same 26 and psychological symptoms—such as mood swings, anxiety, headaches and poor sleep—as those 27 smoking cigarettes or using drugs, according to the study.","The new study 28 the first evidence that these withdrawal-like symptoms can occur when people cut down on highly processed foods, said lead study author Erica Schulte.","Based on the participants’ self-reported symptoms, withdrawal symptoms were 29 more intense between the second and fifth days after attempting to reduce junk-food consumption, which 30 the time span people live through during drug withdrawal.","The idea that food may be addictive after “heavy” use by some individuals is a 31 subject, Schulte said. Although prior studies in animals and humans have shown some biological and behavioral similarities between substance-use disorders and addictive-like consumption of highly processed foods, no studies have looked at whether reducing junk food can 32 withdrawal symptoms in people, she noted.","Raising 33 that people may experience irritability (烦躁) or headaches when cutting down on junk food can help individuals 34 coping strategies in advance, Schulte noted. The findings may also 35 light on the barriers people face when changing eating habits—barriers that may play a role in people dropping out of treatments, she said."],bank:[{letter:"A",word:"awareness"},{letter:"B",word:"canceling"},{letter:"C",word:"controversial"},{letter:"D",word:"emptiness"},{letter:"E",word:"monstrous"},{letter:"F",word:"offers"},{letter:"G",word:"parallels"},{letter:"H",word:"permanently"},{letter:"I",word:"physical"},{letter:"J",word:"prepare"},{letter:"K",word:"prospects"},{letter:"L",word:"quitting"},{letter:"M",word:"shed"},{letter:"N",word:"significantly"},{letter:"O",word:"trigger"}],answers:["I","L","F","N","G","C","O","A","J","M"]}],ul=[{id:"2024-06-1",source:"2024年06月 · 第1套",prompt:"四合院（siheyuan）是中国一种传统的住宅建筑，其特点是房屋建造在一个院子的四周，将院子合围在中间。四合院通常冬暖夏凉，环境舒适，尤其适合大家庭居住。四合院在中国各地有多种类型，其中以北京的四合院最为典型。如今，随着现代城市的发展，传统的四合院已逐渐减少，但因其独特的建筑风格，四合院对中国文化的传承和中国历史的研究具有重",ref:"Siheyuan is a kind of traditional Chinese residential building, which is characterized by houses built around a courtyard, enclosing the courtyard in the middle. Siheyuan is usually warm in winter and cool in summer, offering a comfortable environment, especially suitable for large families to live in. There are many types of Siheyuan in different parts of China, of which the most typical one is in Beijing. Nowadays, with the development of modern cities, the number of traditional Siheyuan has gradually decreased, but because of its unique architectural style, Siheyuan is of great significance to the inheritance of Chinese culture and the study of Chinese history."},{id:"2024-06-2",source:"2024年06月 · 第2套",prompt:"农历（the lunar calendar）起源于数千年前的中国，根据太阳和月亮的运行规律制定。长期以来，农历在农业生产和人们日常生活中发挥着重要作用。古人依据农历记录日期、安排农活，以便最有效地利用自然资源和气候条件，提高农作物的产量和质量。中国的春节、中秋节等传统节日的日期都基于农历。农历是中国传统文化的重要组成部分，当今依然广为",ref:"The lunar calendar, which originated in China thousands of years ago, was formulated based on the movements of the sun and the moon. For a long time, the lunar calendar has played an important role in agricultural production and people’s daily lives. Ancient people recorded dates and arranged farm work according to the lunar calendar in order to make the most efficient use of natural resources and climatic conditions to improve the yield and quality of crops. The Chinese Spring Festival, Mid-Autumn Festival and other traditional festivals are based on the lunar calendar. It is an important component of traditional Chinese culture and is still widely used today."},{id:"2024-06-3",source:"2024年06月 · 第3套",prompt:"汉语中的“福”字（the character fu）表示幸福和好运，是中国传统文化中最常用的吉祥（auspicious）符号之一。人们通常将一个大大的福字写在红纸上，寓意期盼家庭幸福、社会安定、国家昌盛。春节贴福字是民间由来已久的习俗。为了欢庆春节，家家户户都会将福字贴在门上或墙上，表达对幸福生活的向往、对美好未来的期待。人们有时还将福字倒过来贴，表示幸福已到、好运已到。",ref:"The Chinese character “fu”, signifying happiness and good luck, is one of the most commonly used auspicious symbols in traditional Chinese culture. People usually write a big character of fu on red paper, which means that they look forward to family happiness, social stability and national prosperity. Posting the character of fu during the Spring Festival is a long- standing folk custom. In order to celebrate the Spring Festival, every family will put the character of fu on the doors or walls to express the yearning for a happy life and the expectation for a better future. People sometimes put the character of fu upside down, indicating that happiness and good luck have arrived."},{id:"2024-12-1",source:"2024年12月 · 第1套",prompt:"中国政府十分重视环境保护。近年来，中国在减少空气、水和土壤污染上取得了显著成效。为了不断改善人们的生活环境，中国采取了一系列有效措施，包括大力发展清洁能源，改善公共交通，推广共享单车，实施垃圾分类。通过这些措施，中国的城市和农村正在绿起来、美起来。中国还积极参与国际合作，为全球环境保护做出了重要贡献。",ref:"The Chinese government places great emphasis on environmental protection. In recent years, China has made remarkable strides in reducing air, water and soil pollution. The country has adopted a series of effective measures to continuously improve the living environment of its people, including the vigorous development of clean energy, enhancement of public transportation, popularization of shared bikes and implementation of garbage sorting. Thanks to these actions, both urban and rural areas in China are becoming greener and more beautiful. Besides, China is an active participant in international cooperation, contributing significantly to global environmental protection.",tipsLabel:"难点注释",tips:`1. 第一句较短，属于讲述客观事实的句子，翻译时句子时态应选用一般现在时，谓语动词采用第三人称单数形式。“十分重视”是四级段落翻译的高频考点，可译为place great emphasis on。
2. 第二句句首的“近年来”提示本句应使用现在完成时。翻译时要注意调整语序，先翻译句子的主干“……中国……取得了显著成效”，即…China has made remarkable strides…；然后再翻译次要信息“在减少空气、水和土壤污染上”，即in reducing air, water and soil pollution。
3. 第三句较长，翻译之前需要先分析句子结构。翻译时可将“中国采取了一系列有效措施”作为句子主干译出；“为了不断改善人们的生活环境”可处理为不定式结构作目的状语；“包括”可译为介词including，与后面的内容一起构成介词短语；“大力发展清洁能源，改善公共交通，推广共享单车，实施垃圾分类”是四个动宾短语，翻译时可以进行词性转换，处理为名词短语，体现出英语静态的语言特征，如参考译文所示。
4. 第四句中的“正在”表明本句应使用现在进行时；“通过这些措施”可按字面意思译为Through these measures，也可以把句子的逻辑关系显化，译为Thanks to these actions，用actions代替前文的measures，使译文用词富于变化。“绿起来、美起来”可以处理为现在进行时与形容词的比较级结构相结合的形式，即are becoming greener and more beautiful。
5. 第五句包含两个分句，翻译时可以把第二个分句处理为现在分词结构作状语，如参考译文所示。也可以采用并列的谓语结构译出，即“Besides, China is an active participant in international cooperation and contributes significantly to global environmental protection.”`},{id:"2024-12-2",source:"2024年12月 · 第2套",prompt:"近年来，中国新能源汽车产业发展迅速。目前，中国新能源汽车年产量已高达近千万辆，占全球市场份额超过60%，出口量不断创出新高。中国政府通过加大资金投入和政策引导，鼓励新能源汽车企业进行技术创新，不断提高产品在市场上的竞争力。中国新能源汽车产业的发展不仅有力推动了国内经济发展，也为全球新能源利用和环境保护做出了积极贡献。",ref:"In recent years, China's new energy vehicle industry has witnessed rapid growth. With an annual production close to 10 million units, China now holds over 60% of the global market share for new energy vehicles, and its export volume has been continuously reaching new highs. The Chinese government is encouraging new energy vehicle enterprises to carry out technological innovation and constantly enhance the market competitiveness of their products by increasing financial investment and providing policy guidance. The development of China's new energy vehicle industry has not only vigorously promoted domestic economic growth but also made a positive contribution to the global adoption of new energy and environmental protection.",tipsLabel:"难点注释",tips:`1. 第一句较短，在翻译时，由句首的“近年来”可知本句时态宜选用现在完成时。在翻译“发展”这一动词时，可以进行词性转换，处理为抽象名词，体现出英语静态的语言特征，如参考译文所示。本句增译witnessed，使译文更生动。
2. 第二句较长，在翻译时，可将“年产量已高达近千万辆”处理为with结构置于句首，将“占全球市场份额超过60%”译为holds over 60% of the global market share，将“新能源汽车”译为介词短语for new energy vehicles作后置定语；“出口量不断创出新高”可处理为由and连接的并列句，时态选用现在完成进行时，其中“出口量”可译为export volume，“创出新高”可译为reach new highs。
3. 第三句包含三个分句，在翻译时可将“鼓励新能源汽车企业进行技术创新”和“不断提高产品在市场上的竞争力”译为句子主干，“技术创新”可译为technological innovation，“市场上的竞争力”可译为the market competitiveness；“通过加大资金投入和政策引导”可译为介词by引导的方式状语，翻译时应在“政策引导”前增译provide以平衡句子结构，即by increasing financial investment and providing policy guidance。
4. 第四句中的两个分句都描述了新能源汽车产业发展带来的好处，因此可以处理为not only…but also…结构。在翻译“为全球新能源利用和环境保护做出了积极贡献”时应先翻译“为……做出了积极贡献”，即make a positive contribution to…；再将“全球新能源利用和环境保护”译为由and连接的并列结构，即the global adoption of new energy and environmental protection。`},{id:"2024-12-3",source:"2024年12月 · 第3套",prompt:"敦煌莫高窟（Mogao Grottoes）数字展示中心于2014年开放启用，是莫高窟保护利用工程的重要组成部分。展示中心采用数字技术和多媒体展示手段，使游客进入洞窟参观之前就能了解莫高窟的历史文化，鉴赏莫高窟的艺术经典。这将减少开放洞窟的数量，缩短游客在洞窟内的逗留时间，减轻参观对莫高窟造成的影响，以使这一世界文化遗产得到妥善保护、长久利用。",ref:"The Dunhuang Mogao Grottoes Digital Exhibition Center, which was opened in 2014, is an integral part of the conservation and utilization project of the Mogao Grottoes. The exhibition center enables visitors to learn about the culture of the Mogao Grottoes and appreciate its art classics before entering the actual grottoes by adopting digital technology and multimedia presentations. This approach helps to limit the number of grottoes open to the public, reduce the duration of visitors' stay inside and minimize the impact on the Mogao Grottoes, so as to ensure this world cultural heritage site is properly protected and sustainably utilized.",tipsLabel:"难点注释",tips:`1. 第一句包含两个分句，翻译时要注意时态。第一个分句中的时间状语“2014年”表明时态应该使用一般过去时；第二个分句描述客观事实，因此时态应使用一般现在时。根据句子的逻辑关系，第一个分句中的“于2014年开放启用”可翻译为非限制性定语从句；第二个分句可处理为主句，如参考译文所示。“敦煌莫高窟数字展示中心”可以译为The Dunhuang Mogao Grottoes Digital Exhibition Center。“开放”和“启用”语义重复，可以合译为was opened或者was put into use。
2. 第二句较长，包含三个分句。“采用数字技术和多媒体展示手段”可翻译为介词短语by adopting digital technology and multimedia presentations，作为方式状语置于句末。“展示中心……使游客……能了解莫高窟的历史文化，鉴赏莫高窟的艺术经典”可译为句子主干，使用sth. enable(s) sb. to do sth.这一结构，即The exhibition center enables visitors to learn about the culture of the Mogao Grottoes and appreciate its art classics；“进入洞窟参观之前”可翻译为before entering the actual grottoes，作时间状语。
3. 第三句较长，翻译时需要理清句子之间的逻辑关系。前三个分句中的“减少”“缩短”和“减轻”可翻译为并列谓语；最后一个分句可翻译为目的状语，使用被动语态结构，即so as to ensure this world cultural heritage site is properly protected and sustainably utilized。也可以将原句拆分，把最后一个分句单独译为一句，即“This is to ensure the proper preservation and sustainable use of the world cultural heritage site.”。在细节处理方面，本句涉及增译和减译翻译技巧的运用，比如“减少开放洞窟的数量”可译为limit the number of grottoes open to the public，增译to the public；“缩短游客在洞窟内的逗留时间”可译为reduce the duration of visitors' stay inside，减译“洞窟”；“减轻参观对莫高窟造成的影响”可译为minimize the impact on the Mogao Grottoes，减译“参观”；“这一世界文化遗产”可译为this world cultural heritage site，增译site。通过增译和减译，使译文更加准确、简洁。`},{id:"2025-06-1",source:"2025年06月 · 第1套",prompt:"被誉为“杂交水稻(hybrid rice)之父”的袁隆平和他的科研团队克服重重困难，研发出了一种超级杂交水稻。这项技术获得了举世公认的巨大成功。通过这项技术的应用，水稻抗旱抗病能力更强，能适应不同的气候和土壤条件，产量可提高20-30%。超级杂交水稻营养丰富，口感更佳。目前，这项技术已经在许多国家得到广泛应用，为全球粮食安全做出了重大贡献。",ref:"Yuan Longping, known globally as the “Father of Hybrid Rice,” and his research team overcame numerous challenges to successfully develop a super hybrid rice variety. This technology has been universally recognized as a tremendous success. Through the application of this technology, the rice exhibits stronger drought and disease resistance, adapts to diverse climatic and soil conditions, and achieves a 20-30% increase in yield. The super hybrid rice is also more nutritious and has a superior taste. Currently, the technology has been widely applied in many countries, making significant contributions to global food security.",tips:`1. 本句除了难词译注中列出的重点词汇之外，还应注意分析前后分句逻辑关系。通过分析可知，“研发出了一种超级杂交水稻”是“克服重重困难”的结果，因此应将“克服重重困难”作为子句谓语，翻译成overcame numerous challenges，而“研发出了一种超级杂交水稻”翻译成表示结果的不定式短语，即to successfully develop a super hybrid rice variety，增译successfully一词是为了突出这一结果的成功性，更符合英文表达习惯。
2. 本句要强调的是“举世公认”和“巨大成功”两个要素，而且要在同一个英文句子中体现出来，因此首先应使用be recognized as a success这一基本短语来表达，再分别对recognized和success进行修饰，故“获得了举世公认的巨大成功”应翻译为has been universally recognized as a tremendous success。
3. “通过这项技术的应用”是方式状语，应翻译为介词短语Through the application of this technology；“抗旱抗病能力更强”“能适应不同的气候和土壤条件”“产量可提高20-30%”叙述的是该水稻的优点，应该翻译为三个并列的谓语部分，即exhibits stronger drought and disease resistance, adapts to diverse climatic and soil conditions, and achieves a 20-30% increase in yield。
4. “营养丰富，口感更佳”是对“超级杂交水稻”特点的描述，根据英文表达习惯，应翻译成谓语，而两者为并列结构，根据“口感更佳”可知，“营养丰富”暗含比较意味，应翻译成比较级结构，故二者翻译为is also more nutritious and has a superior taste，增译also一词是为了与前一句衔接，体现前后句的逻辑关系。
5. 前一个分句“目前，这项技术已经在许多国家得到广泛应用”是主体，应翻译为Currently, the technology has been widely applied in many countries，而“为全球粮食安全做出了重大贡献”为补充说明性内容，表示伴随情况，故使用现在分词短语来翻译，即making significant contributions to global food security。`,tipsLabel:"译点精析"},{id:"2025-06-2",source:"2025年06月 · 第2套",prompt:"近年来，中国东北地区正在大力开发冰雪资源。例如，哈尔滨利用丰富的冰雪资源打造了极具地方特色的“冰雪大世界”，让游客在欣赏冰雪之美的同时也能体验当地独特的民俗文化。如今，曾令人畏惧的冰天雪地正吸引着四面八方的游客，成为深受欢迎的旅游胜地。冰雪旅游业正为当地的经济发展做出越来越大的贡献。",ref:"In recent years, Northeast China has been vigorously developing its ice and snow resources. For instance, Harbin has created the highly distinctive “Ice and Snow World” by leveraging its abundant ice and snow resources, allowing visitors to appreciate the beauty of ice and snow while experiencing the region's unique folk culture. What was once an intimidating frozen landscape is now attracting tourists from all directions, becoming a highly popular tourist destination. The ice and snow tourism industry is making an increasingly significant contribution to local economic development.",tips:`1. 第一句：“近年来”翻译为In recent years；“中国东北地区”翻译为Northeast China；“正在大力开发”翻译为has been vigorously developing。
2. 第二句：本句较长，先进行拆分，主体句是“哈尔滨利用丰富的冰雪资源打造了极具地方特色的‘冰雪大世界’”，翻译为Harbin has created the highly distinctive “Ice and Snow World” by leveraging its abundant ice and snow resources；“让游客在欣赏冰雪之美的同时也能体验当地独特的民俗文化”是补充说明性内容，表示动作，且逻辑主语即整个句子的主语“哈尔滨”，故翻译为现在分词短语，充当伴随状语，即allowing visitors to appreciate the beauty of ice and snow while experiencing the region's unique folk culture，注意“在……的同时”强调“在……的过程中同时进行另一项活动”，需使用while连接；句首的“例如”翻译为For example或For instance。
3. 第三句：主体句是“曾令人畏惧的冰天雪地正吸引着四面八方的游客”，其中“曾令人畏惧的冰天雪地”可翻译为The once-feared frozen wilderness、The formerly daunting ice-and-snow landscape或What was once an intimidating frozen landscape，“正吸引着四面八方的游客”翻译为is now attracting tourists from all directions；“成为深受欢迎的旅游胜地”表示补充说明，是伴随情况，翻译为现在分词短语becoming a highly popular tourist destination，“旅游胜地”还可翻译为tourist attraction。
4. 第四句：“冰雪旅游业”翻译为The ice and snow tourism industry；谓语“正为当地的经济发展做出越来越大的贡献”翻译为is making an increasingly significant contribution to local economic development。`,tipsLabel:"译点精析"},{id:"2025-06-3",source:"2025年06月 · 第3套",prompt:"近年来，中国越来越多的城市着力打造“15分钟便民生活圈(convenient living circles)”。社区居民步行15分钟就能享受到日常所需的公共服务。生活圈内建有便利店、公园、健身场地、图书馆、学校、社区食堂、诊所等。生活圈的建立能够为居民提供更加便利、舒适、友好、愉悦的生活环境，更好地满足城市居民多元化的日常生活服务需求，提升居民的生活品质和幸福感。",ref:"In recent years, an increasing number of cities in China have been focusing on building the “15-minute convenient living circles”. Local communities can access daily public services within a 15-minute walk. These living circles include facilities such as convenience stores, parks, fitness areas, libraries, schools, community canteens, and clinics. These living circles are built to provide residents with a more convenient, comfortable, friendly, and enjoyable living environment, better meeting the needs of diverse everyday services of urban dwellers while enhancing their quality of life and sense of happiness.",tips:`1. “近年来”翻译为In recent years；“越来越多的”可翻译为an increasing number of或more and more，前者是首选；翻译“着力打造‘15分钟便民生活圈’”时，应注意使用现在完成时或现在完成进行时，呼应句首的“近年来”这一完成时标志性的时间状语，故可译为have been focusing on building the “15-minute convenient living circles”或having focused on building the “15-minute convenient living circles”，现在完成进行时更强调过去到现在的持续进行的状态。
2. 第二句：“步行15分钟”在此时为状语，可翻译为介词短语within a 15-minute walk；“享受到日常所需的公共服务”可翻译为can access daily public services，can have access to或can enjoy convenient access to everyday public services等。
3. 第三句：“生活圈内”可以直接翻译为“内”，用“生活圈”，即These living circles作主语；当然，也可以不译，直接翻译为状语，即Within these circles。后一句中，后面的内容“建有便利店、公园、健身场地、图书馆、学校、社区食堂、诊所等”应使用there be句型来表达，即there are facilities such as convenience stores, parks, fitness areas, libraries, schools, community canteens, and clinics，或者添加主语“人们”，将其翻译为people build facilities such as…；不过综合来看，后一情况中的两种翻译方式都不如第一种省译情况更直接了，更符合英文表达习惯。
4. 第四句：本句较长，可先分析句子逻辑关系，进行拆分后再逐一翻译。通过分析可知，“生活圈的建立能够为居民提供更加便利、舒适、友好、愉悦的生活环境”是主体，翻译为These living circles are built to provide residents with a more convenient, comfortable, friendly, and enjoyable living environment；“更好地满足城市居民多元化的日常生活服务需求”和“提升居民的生活品质和幸福感”是并列关系，表示同时存在的情况，可使用while连接，联系主体句的内容，后面的两个并列分句共同充当伴随状语，应使用现在分词短语来翻译，即better meeting the needs of diverse everyday services of urban dwellers while enhancing their quality of life and sense of happiness。`,tipsLabel:"译点精析"},{id:"2025-12-1",source:"2025年12月 · 第1套",prompt:"近年来，中国政府高度重视民营经济(private economy)的发展，出台了一系列政策支持民营企业。截至2025年3月底，全国民营企业数量超过5700万家，占企业总量的92.3%。民营企业不仅数量稳步增长，质量和结构也在不断提升。民营企业的研发投入不断增加，在新一代信息技术、人工智能等领域发展迅速。民营企业核心竞争力的增强为中国经济的高质量发展提供了有力支撑。",ref:"In recent years, the Chinese government has attached great importance to the development of the private economy and introduced a series of policies to support private enterprises. As of the end of March 2025, the number of private enterprises nationwide has exceeded 57 million, accounting for 92.3% of the total number. Private enterprises have achieved not only steady growth in quantity but also continuous improvement in quality and structure. With increasing investment in research and development, private enterprises have expanded rapidly in fields such as new-generation information technology and artificial intelligence. The enhanced core competitiveness of private enterprises has provided strong support for China's high-quality economic development.",tips:`1. 第一句：“近年来”翻译为In recent years；“高度重视”和“出台”并列，翻译成并列谓语动词，即has attached great importance to and introduced。
2. 第二句：“占企业总量的92.3%”表示伴随情况，翻译成现在分词短语，即accounting for 92.3% of the total number。
3. 第三句：“不仅数量稳步增长，质量和结构也在不断提升”含有“不仅……而且……”的并列结构，翻译为have achieved not only steady growth in quantity but also continuous improvement in quality and structure。
4. 第四句：“研发投入不断增加”是“在新一代信息技术、人工智能等领域发展迅速”的原因或背景信息，前者可翻译成with结构，即With increasing investment in research and development，后者翻译为private enterprises have expanded rapidly in fields such as new-generation information technology and artificial intelligence。
5. 第五句：句子主语是“民营企业核心竞争力的增强”，翻译为The enhanced core competitiveness of private enterprises；“为中国经济的高质量发展提供了有力支撑”为谓语和宾语部分，翻译为has provided strong support for China's high-quality economic development。`,tipsLabel:"译点精析"},{id:"2025-12-2",source:"2025年12月 · 第2套",prompt:"近年来，“城市漫步(city walk)”在中国的年轻人中悄然兴起，已成为一种旅游新潮流。与传统旅游不同，城市漫步不追求在短时间内游览尽可能多的景点，而是随意行走或按照主题路线漫步在城市的大街小巷。漫步者品尝地道小吃，欣赏特色建筑，了解当地生活方式。他们还用相机或手机记录城市的风景和人物。这种旅游方式能让城市漫步者更深入了解城市的历史与文化。",ref:"In recent years, “city walk” has quietly emerged among young people in China, becoming a new travel trend. Unlike traditional tourism, city walk does not aim to visit as many attractions as possible in a short period. Instead, it involves strolling casually or following themed routes through the streets and alleys of a city. Walkers sample local snacks, admire distinctive architecture, and learn about the local way of life. They also capture the city's scenery and people with cameras or smartphones. This form of travel allows city walkers to gain a deeper understanding of the city's history and culture.",tips:`1. 第一句：句子的谓语“在中国的年轻人中悄然兴起”翻译为has quietly emerged among young people in China；“已成为一种旅游新潮流”表示伴随情况或结果，翻译成现在分词短语，即becoming a new travel trend。
2. 第二句：“不追求在短时间内游览尽可能多的景点”是句子的谓语和宾语部分，翻译为does not aim to visit as many attractions as possible in a short period；“而是随意行走或按照主题路线漫步在城市的大街小巷”翻译为单独的句子，即Instead, it involves strolling casually or following themed routes through the streets and alleys of a city。
3. 第三句：句子的谓语和宾语部分由三个并列短语构成，即“品尝地道小吃”“欣赏特色建筑”和“了解当地生活方式”，翻译为sample local snacks, admire distinctive architecture, and learn about the local way of life。
4. 第四句：“记录”翻译成capture（意为“拍摄；捕获”），比record更贴切，更生动，能体现“捕捉瞬间”的感觉。
5. 第五句：“这种旅游方式”是句子主语，翻译为This form of travel；“能让城市漫步者更深入了解城市的历史与文化”是句子的谓语和宾语部分，翻译为allows city walkers to gain a deeper understanding of the city's history and culture，使用了allow sb. to do sth.（允许某人做某事）的结构。`,tipsLabel:"译点精析"},{id:"2025-12-3",source:"2025年12月 · 第3套",prompt:"中国政府十分重视绿色经济的发展。通过加强森林资源保护、加大污染治理力度等一系列措施，许多地区的生态环境得到了显著改善。绿水青山(lucid waters and lush mountains)促进了当地的旅游、健康等产业的发展，创造了可观的经济效益。如今，生态环境与人类社会和谐共存的观念在中国已深入人心。绿色经济的推进不仅能为中国可持续发展做出贡献，也为全球环境保护提供了宝贵经验。",ref:"The Chinese government places great emphasis on the development of the green economy. Through a series of measures, such as strengthening the protection of forest resources and intensifying pollution control, the ecological environment in many regions has been significantly improved. Lucid waters and lush mountains have boosted the growth of local industries like tourism and healthcare, generating substantial economic benefits. Today, the concept of harmonious coexistence between the ecological environment and human society has taken deep root in China. The advancement of the green economy not only contributes to China's sustainable development but also provides valuable experience for global environmental protection.",tips:`1. 第一句：“十分重视”除了可翻译为places great emphasis on，还可翻译为attaches great importance to等。
2. 第二句：“通过……一系列措施”翻译成介词短语，即Through a series of measures, such as strengthening the protection of forest resources and intensifying pollution control；“许多地区的生态环境得到了显著改善”是句子主干，翻译为the ecological environment in many regions has been significantly improved。
3. 第三句：“绿水青山促进了……”为句子主干，翻译为Lucid waters and lush mountains have boosted the growth of local industries like tourism and healthcare；“创造了可观的经济效益”表示结果，可翻译成现在分词短语，即generating substantial economic benefits，作结果状语。
4. 第四句：“生态环境与人类社会和谐共存的观念”是句子主语，翻译为the concept of harmonious coexistence between the ecological environment and human society；“在中国已深入人心”是谓语部分，翻译为has taken deep root in China。
5. 第五句：“绿色经济的推进”是句子的主语，翻译为The advancement of the green economy；“不仅……也……”翻译为并列结构not only…but also…；“为中国可持续发展做出贡献”翻译为contributes to China's sustainable development；“为全球环境保护提供了宝贵经验”翻译为provides valuable experience for global environmental protection。`,tipsLabel:"译点精析"},{id:"2026-06-1",source:"2026年06月 · 第1套",prompt:"中国有句老话：“一日为师，终身为父”。在中国人的观念里，老师不仅传授知识，更教给学生做人的道理。在古代，学生初次见老师时要举行隆重的仪式，足见老师地位之高。为弘扬尊师的优良传统，中国从1985年开始将每年的9月10日定为教师节。在这一天，学生以各种方式表达对老师的敬意。尊师是中华民族的传统美德，在当今社会得到了发扬光大。",ref:"As an old Chinese saying goes, “A teacher for a day is a father for a lifetime.” In the mindset of Chinese people, a teacher not only imparts knowledge but also teaches students the principles of being a good person. In ancient times, students held a solemn ceremony when they first met their teachers, which fully shows the high status of teachers. Therefore, to promote the fine tradition of respecting teachers, China has designated September 10th as Teachers’ Day since 1985. On this day, students express their respect for their teachers in various ways. Respecting teachers is a traditional virtue of the Chinese nation, which has been carried forward and greatly enhanced in today’s society.",tips:`1. 中国有句老话：“一日为师，终身为父。”本句描述的是普遍认可的真理，在英语中，表达谚语、科学事实或普遍真理时，通常使用一般现在时；中文原句无被动含义，因此译文使用主动语态，句子结构较为简单，顺译即可。“中国有句老话”可译为As an old Chinese saying goes或There is an old saying in China；“一日为师，终身为父”可简译为A teacher for a day is a father for a lifetime，也可以遵照其含义，译为One who teaches you, even for a single day, deserves the lifelong respect you give your own father。
2. 在中国人的观念里，老师不仅传授知识，更教给学生做人的道理。本句描述的是普遍观念，属于客观表达，因此译文使用一般现在时；主语是动作（传授、教给）的执行者，因此译文使用主动语态。“在中国人的观念里”处理为介词短语作状语，置于句首；“不仅……更……”使用not only…but also…结构，本句顺译即可。“在……的观念里”可译为in the mindset/eyes/conception/perception of…；“传授知识”可译为impart knowledge或pass on knowledge；“教给学生做人的道理”中的“做人”不可直接译为being a human，在该句语境中是指在社会、伦理、道德层面成为一个合格、得体、有修养的人，“道理”则指其中的准则、原则和智慧，因此可译为teaches students the principles of being a good person。
3. 在古代，学生初次见老师时要举行隆重的仪式，足见老师地位之高。本句可拆分为两个逻辑层次：一是事实描述，即“在古代，学生初次见老师时要举行隆重的仪式”；二是结论评述，即“足见老师地位之高”。翻译时可将事实描述作为主句，结论评述处理成which引导的非限制性定语从句。由“在古代”“初次”可知，主句需使用一般过去时，且主语“学生”是动作的执行者，因此主句使用主动语态；“老师地位之高”是一种普遍的社会观念和认知，因此which引导的非限制性定语从句需使用一般现在时。“在古代”可译为In ancient times或In olden times；“举行”译为hold；“隆重的仪式”可译为a solemn/grand/formal ceremony；“足见”可以理解为“完全可以看出/足以说明”，译为fully show/reflect/indicate/demonstrate；“老师地位之高”可译为the high status of teachers，也可以翻译成含有感叹语气的表达，即how high teachers' status is。
4. 为弘扬尊师的优良传统，中国从1985年开始将每年的9月10日定为教师节。由“从1985年开始”可知，动作从1985年开始，一直持续到现在，且可能继续下去，因此译文使用现在完成时更合适；如果用一般过去时，只表示“1985年那年定下了”，无法体现“一直延续到现在”的状态。主语“中国”是动作“定为”的执行者，因此译文使用主动语态；“为弘扬尊师的优良传统”是后续动作的目的，因此处理为不定式短语作目的状语，置于句首；“中国从……教师节”作为主句，“从1985年开始”为时间状语，置于句尾。在本句译文最开头可加表示因果关系的逻辑关系词Therefore，使本句与第3句衔接更加紧密。“为……”可译为To do…或In order to do…；“……的优良传统”可译为the fine tradition of…；“尊师”即“尊重老师”，译为respect teachers；“从……（时间）开始”译为since+时间点；“将……定为……”可译为designate…as…或establish…as…或set…as…；“教师节”有固定的英文表达，即Teachers' Day。
5. 在这一天，学生以各种方式表达对老师的敬意。本句描述一个反复发生的规律性行为，即每年的教师节都是如此，因此译文使用一般现在时；主语“学生”是动作“表达”的执行者，因此译文使用主动语态即可。本句为简单句，译文可处理为“时间状语+主谓宾+方式状语”的结构。“在这一天”处理成介词短语作时间状语，置于句首；“学生”为主语；“表达”为谓语；“对老师的敬意”为宾语；“以各种方式”处理成介词短语作方式状语，置于句尾。“在这一天”译为On this day即可；“以各种方式”可译为in various/different ways或in a variety of ways；“表达对某人的敬意”可译为express/show respect for sb.。
6. 尊师是中华民族的传统美德，在当今社会得到了发扬光大。本句可拆分为两个逻辑层次：一是信息陈述核心事实，即“尊师是中华民族的传统美德”；二是补充信息，进一步解释说明核心事实，即“在当今社会得到了发扬光大”。因此可将主信息作为主句，翻译成“主系表”结构；将补充信息处理成which引导的非限制性定语从句。主句描述的是普遍事实，因此译文使用一般现在时；which引导的非限制性定语从句强调从过去到现在这一美德得以延续和发展，且对当下有影响，因此该部分使用现在完成时更合适；“得到发扬光大”隐含“被（社会/人们）发扬光大”的含义，因此该部分需使用被动语态。“中华民族”译为the Chinese nation；“传统美德”可译为traditional virtue；“得到了发扬光大”应理解为“不仅保留下来了，而且做得更好、影响更大”，译为be carried forward and greatly enhanced。`,tipsLabel:"翻译点拨"},{id:"2026-06-2",source:"2026年06月 · 第2套",prompt:"餐桌礼仪（dining etiquette）是中华传统文化的重要组成部分，蕴含着热情有礼的待客之道。为了招待客人，主人会根据客人的口味和喜好准备丰富精致的菜肴。就餐座位的安排非常讲究，主人坐在正对大门的位置，在主人身边就座的是最重要的客人。进餐时，主人会不时地为客人添酒加菜。这种独特的餐桌礼仪已延续了数千年，对促进和谐的人际交往起到了重要作用。",ref:"Dining etiquette is an important part of traditional Chinese culture, embodying a warm and polite way of hospitality. To entertain guests, hosts prepare abundant and exquisite dishes based on the guests’ tastes and preferences. In addition, the seating arrangement at a meal is very particular: the host takes the seat directly facing the door, and the most important guests sit next to the host. During the meal, the host will refill the guests’ glasses and add food to their plates from time to time. This unique dining etiquette has lasted for thousands of years and has played a significant role in promoting harmonious interpersonal communication.",tips:`1. 餐桌礼仪（dining etiquette）是中华传统文化的重要组成部分，蕴含着热情有礼的待客之道。本句是对餐桌礼仪的客观描述，译文使用一般现在时即可，全句无被动含义，因此使用主动语态。分析句意可知，分句一“餐桌礼仪……部分”可作为主句，处理为“主系表”结构；分句二“蕴含着……之道”可处理为现在分词短语作伴随状语，对主句进行补充说明。“中华传统文化”可译为traditional Chinese culture；“……的重要组成部分”可译为an important part of…；“蕴含”可译为embody；“热情有礼的”可译为warm and polite；“待客之道”可译为way of hospitality，或者直接译为hospitality，这个词本身指的就是“待客的好意、行为、方式”。
2. 为了招待客人，主人会根据客人的口味和喜好准备丰富精致的菜肴。本句陈述的是一般性的文化习俗，英文通常使用一般现在时；主语“主人”是动作“准备”的发出者，因此译文使用主动语态。本句结构清晰，“为了招待客人”表示目的，处理为不定式短语作目的状语；“主人”为主语；“准备”为谓语；“丰富精致的菜肴”为宾语；“根据客人的口味和喜好”可以处理为过去分词短语（based on…）作后置定语，解释说明菜肴是按照什么标准准备的，也可以处理为介词短语（according to…）作状语，置于句尾。“招待客人”可译为entertain/host/treat guests；“主人”译为host即可；“根据”可译为（be）based on…或according to…；“客人的口味和喜好”可译为the guests' tastes and preferences；“丰富精致的”可译为abundant and exquisite或rich and fine；“菜肴”可译为dishes。
3. 就餐座位的安排非常讲究，主人坐在正对大门的位置，在主人身边就座的是最重要的客人。本句描述的是中国餐桌文化中普遍存在的礼仪规则，属于常态性的描述，因此译文使用一般现在时，全句无被动含义，因此使用主动语态。本句由三个分句组成，分句一总述就餐座位安排的特点，分句二和分句三具体说明座位是如何安排的，因此分句一后用冒号引出分句二和分句三的内容，分句二和分句三用并列连词and连接即可。此外，为了使句子间的衔接更加紧密，可以在本句开头添加表示递进关系的逻辑关系词In addition、Moreover或Furthermore等。“就餐座位”可译为seating arrangement at a meal或dining seating arrangement；“安排”译为arrangement即可；“讲究”可译为particular；“坐在正对大门的位置”可译为takes the seat directly facing the door或sits directly facing the door；“在主人身边就座的是最重要的客人”即“最重要的客人坐在主人旁边”，“在（某人）身边就座”可译为sit next to sb.或sit beside sb.。
4. 进餐时，主人会不时地为客人添酒加菜。本句描述中国餐桌礼仪中的习惯性行为，翻译时可用一般现在时，也可用will表示习惯性的行为，体现“在这种场合下通常会这样做”的含义；主语“主人”是动作的发出者，因此译文使用主动语态。“进餐时”处理为介词短语作时间状语，置于句首；“主人”为主语；“不时地”作频率状语；“添”“加”为谓语；“酒”“菜”为宾语。“进餐时”可译为During the meal；“不时地”可译为from time to time或occasionally；“为客人添酒加菜”可理解为往客人杯中加酒使其由不满变为满、往客人盘中添加菜肴，因此可译为refill the guests' glasses and add food to their plates。
5. 这种独特的餐桌礼仪已延续了数千年，对促进和谐的人际交往起到了重要作用。本句由两个分句组成，可处理为由and连接的并列句，共用同一个主语“这种独特的餐桌礼仪”。分句一中由“已”可知动作从过去开始持续到现在，且可能继续延续；分句二中“起到了重要作用”表示从过去到现在一直在起作用且对当下仍有意义，因此两个分句的译文均使用现在完成时；主语执行“延续”和“起作用”两个动作，均使用主动语态。“独特的”可译为unique或distinctive；“延续了数千年”可译为last for thousands of years；“对……起到了重要作用”可译为play a significant role in或play an important role in；“促进”可译为promote或foster；“和谐的”可译为harmonious；“人际交往”可译为interpersonal communication。`,tipsLabel:"翻译点拨"},{id:"2026-06-3",source:"2026年06月 · 第3套",prompt:"在中国传统文化中，亲朋好友之间互赠礼物是人际交往的一种重要礼节（etiquette）。赠送礼物不仅是物质的馈赠，更是情感的表达，是维系人际关系的重要纽带。一份精心挑选、符合接受者喜好的礼物，往往能加深彼此的感情。中国人遵循“礼尚往来”（mutually exchanging courtesies）的传统，接受礼物时会表达谢意，并适时回赠礼物，以增进彼此的融洽关系。",ref:"In traditional Chinese culture, exchanging gifts among friends and relatives is an important etiquette in interpersonal communication. Giving gifts is not merely a material offering but also an expression of emotion, serving as an important bond that maintains interpersonal relationships. Therefore, a carefully selected gift that caters to the recipient’s preferences can often deepen mutual affection. The Chinese follow the tradition of “mutually exchanging courtesies”: when receiving a gift, they express gratitude and return a gift at an appropriate time, so as to enhance the harmonious relationship with one another.",tips:`1. 在中国传统文化中，亲朋好友之间互赠礼物是人际交往的一种重要礼节（etiquette）。本句描述的是客观事实，不是过去、现在或未来的具体事件，因此译文使用一般现在时；“是”表明该句使用系表结构，为主动语态。本句为“地点状语+主系表”结构：“在中国传统文化中”处理为介词短语作地点状语，限定互赠礼物的文化背景；“亲朋好友之间互赠礼物”为主语，其中核心表达为“互赠礼物”，处理为动名词，“亲朋好友之间”处理为介词短语作后置定语；“是”为系动词；“人际交往的一种重要礼节”为表语，其中“一种重要礼节”为核心表达，“人际交往的”可以理解为“在人际交往方面”，处理为介词短语作后置定语。“中国传统文化”译为traditional Chinese culture；“亲朋好友”即“朋友和亲戚”，可译为friends and relatives；“互赠礼物”可译为exchange gifts或give gifts to each other；“人际交往”可译为interpersonal communication。
2. 赠送礼物不仅是物质的馈赠，更是情感的表达，是维系人际关系的重要纽带。本句描述的是“赠送礼物”这一行为的本质属性和社会功能，因此译文使用一般现在时；三个“是”表明该句使用系表结构，为主动语态。本句由三个分句组成，分句一和分句二描述赠送礼物的本质属性，属于一个意群，分句三是对其社会功能的描述，属于一个独立的意群。因此可以将分句一、二分作为主句，其中“不仅……，更……”用not only…but also…结构；分句三处理成现在分词短语作伴随状语，其主干为“是重要纽带”，“维系人际关系”可处理为定语从句，修饰“纽带”。“赠送礼物”可译为giving gifts；“物质的馈赠”可译为a material offering；“情感的表达”可译为an expression of emotion；“维系人际关系”可译为maintain/sustain interpersonal relationships；“纽带”可译为bond。
3. 一份精心挑选、符合接受者喜好的礼物，往往能加深彼此的感情。本句描述的是礼物对人的情感产生的普遍作用，属于客观事实，因此译文使用一般现在时；主语“礼物”发出“加深”这个动作，因此译文使用主动语态。本句为“主谓宾”结构，主语较长，可以将“一份精心挑选的礼物”作为主语核心词，将“符合接受者喜好”处理为定语从句；“能加深”为谓语；“彼此的感情”为宾语。本句与第2句暗含因果关系，第2句为“因”，本句为“果”，因此可以在本句译文的句首添加表示因果关系的逻辑关系词，如Therefore、Thus或As a result。“精心挑选”可译为carefully selected/chosen；“符合……喜好”可译为cater to someone's preferences或suit someone's preferences；“接受者”可译为recipient或receiver；“加深彼此的感情”可译为deepen mutual affection。
